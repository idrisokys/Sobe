<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{color-scheme:dark;--ac:#ff1a1a;--ac-h:#ff4040;--ac-t:#ff5a5a;--ac-x:#ff3b3b;--ac-xbg:#ff3b3b26;--ac-xh:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;padding:8px;width:260px;background:#1a1a1e;color:#e8e8ec;font:12px/1.3 -apple-system,system-ui,sans-serif}
.bar{display:flex;justify-content:space-between;gap:6px;padding-bottom:6px;border-bottom:1px solid #ffffff1f}
.bar label{display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.bar input{margin:0;accent-color:var(--ac)}
.grp{display:flex;align-items:center;gap:8px}
.grp span{font-weight:600}
.offb{background:#3a3a42;font-weight:700;padding:3px 12px}
.offb:hover{background:#4a4a54}
.offb.on{background:#2f7bff}
.offb.on:hover{background:#5592ff}
.bar label:has(input:disabled){opacity:.45;cursor:default}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #ffffff14}
.item:last-child{border-bottom:0;padding-bottom:0}
.item b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
button{padding:3px 9px;border-radius:5px;border:0;background:var(--ac);color:#fff;cursor:pointer;font:inherit}
button:hover{background:var(--ac-h)}
#jobs{margin-top:8px;border-top:1px solid #ffffff1f;padding-top:6px;max-height:260px;overflow-y:auto}
.jobs-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.jobs-h b{font-weight:600;opacity:.8}
.jobs-h button{background:none;color:#e8e8ec99;padding:0 2px}
.jobs-h button:hover{background:none;color:#fff}
.job{padding:5px 0}
.job .row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.job .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.job .x{background:none;color:var(--ac-x);padding:2px;flex:none;display:flex;align-items:center;border-radius:3px}
.job .x:hover{background:var(--ac-xbg);color:var(--ac-xh)}
.track{height:5px;background:#ffffff1f;border-radius:3px;overflow:hidden;margin:4px 0 2px}
.fill{height:100%;width:0;background:var(--ac);border-radius:3px;transition:width .25s}
.job.queued .st{color:#ffc857;opacity:.9}
.job.done .fill{background:#3ecf6e}
.job.error .fill{background:#888}
.job.ind .fill{width:35%;transition:none;animation:ind 1.1s infinite ease-in-out}
@keyframes ind{0%{margin-left:-35%}100%{margin-left:100%}}
.job .st{opacity:.65;font-size:11px;word-break:break-word}
#series{margin:8px 0 2px;padding-bottom:8px;border-bottom:1px solid #ffffff1f}
#series .srow{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:5px}
#series label{display:flex;align-items:center;gap:4px;white-space:nowrap}
#series input[type=number]{width:46px;padding:2px 4px;border-radius:4px;border:1px solid #ffffff33;background:#26262c;color:inherit;font:inherit}
#series input:disabled{opacity:.5}
#serBtn.stop{background:#555}
#serSt{margin-top:4px;opacity:.75;font-size:11px;word-break:break-word}
</style></head>
<body>
<div class="bar">
  <div class="grp"><label><input id="above" type="checkbox"> &gt;</label><span>1080</span><label><input id="below" type="checkbox"> &lt;</label></div>
  <button id="off" class="offb" title="Algılamayı kapat">OFF</button>
</div>
<div id="series">
  <div class="srow"><b>Seri</b><span id="serTpl" style="opacity:.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0"></span></div>
  <div class="srow"><label>Bölüm <input id="epN" type="number" min="1"></label><label>Son <input id="epL" type="number" min="1" placeholder="∞"></label><button id="serBtn">Başlat</button></div>
  <div id="serSt"></div>
</div>
<div id="list"></div>
<div id="jobs" hidden><div class="jobs-h"><b>İndirilenler</b><button id="clear">Temizle</button></div><div id="jobList"></div></div><script src="series.js"></script><script src="popup.js"></script></body></html>
