name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # JDK 25: Kadb ships Java 25 bytecode, so :adb tests need a 25 runtime.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Only the debug APK: no unit tests, no lint, no release builds.
      - run: sh ./gradlew :app:assembleGithubDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: tellyscope-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
